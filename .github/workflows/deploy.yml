name: Build and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build book
        run: python3 docs/finance-book/tools/build_book.py

      - name: Validate structure and links
        run: |
          python3 docs/finance-book/tools/check_structure.py
          python3 docs/finance-book/tools/check_links.py

      - name: Deploy to GitHub Pages (gh-pages branch)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: docs/finance-book
          publish_branch: gh-pages
          force_orphan: true

  deploy-cloudflare:
    needs: build-deploy
    runs-on: ubuntu-latest
    if: ${{ vars.ENABLE_CLOUDFLARE == 'true' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build book
        run: python3 docs/finance-book/tools/build_book.py

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy docs/finance-book --project-name=finance-to-quant --branch=main
